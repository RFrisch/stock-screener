<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>52-Week Low Stock Screener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }

        .container {
            max-width: 2200px;
            margin: 0 auto;
            padding: 0.5rem 1rem 1rem;
        }

        .header-bar {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1rem 1.5rem;
            padding: 0.4rem 0.25rem 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }

        .header-stats {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .header-stats .stat {
            display: inline-flex;
            align-items: baseline;
            gap: 0.35rem;
        }

        .header-stats .stat-value {
            color: #60a5fa;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .header-stats .last-updated {
            color: #64748b;
        }

        .table-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        @media (min-width: 1500px) {
            .table-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .table-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem 0.4rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        th:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        th .sort-icon {
            margin-left: 4px;
            opacity: 0.5;
        }

        th.sort-asc .sort-icon::after { content: '▲'; }
        th.sort-desc .sort-icon::after { content: '▼'; }
        th:not(.sort-asc):not(.sort-desc) .sort-icon::after { content: '⇅'; }

        td {
            padding: 0.18rem 0.4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .stock-cell {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .ticker {
            font-weight: 600;
            color: #60a5fa;
            min-width: 44px;
            font-size: 0.78rem;
        }

        .company-name {
            color: #94a3b8;
            font-size: 0.68rem;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }

        .sector-badge {
            display: inline-block;
            padding: 0.1rem 0.4rem;
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
            border-radius: 9999px;
            font-size: 0.62rem;
            font-weight: 500;
        }

        .price {
            font-weight: 500;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.72rem;
        }

        .range-bar {
            width: 50px;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .range-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            border-radius: 3px;
        }

        .range-marker {
            position: absolute;
            top: -1px;
            width: 3px;
            height: 8px;
            background: #fff;
            border-radius: 1px;
            transform: translateX(-50%);
        }

        .pct-badge {
            display: inline-block;
            padding: 0.08rem 0.35rem;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        .pct-low {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .pct-med {
            background: rgba(234, 179, 8, 0.2);
            color: #facc15;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #94a3b8;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            padding: 3rem;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0.5rem;
            }

            .table-container {
                overflow-x: auto;
            }

            table {
                min-width: 700px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>52-Week Low Screener</h1>
            <div class="header-stats">
                <span class="stat"><span class="stat-value" id="stocksFound">-</span> found</span>
                <span class="stat"><span class="stat-value" id="totalScreened">-</span> screened</span>
                <span class="stat">threshold <span class="stat-value" id="threshold">-</span></span>
                <span class="stat last-updated" id="lastUpdated"></span>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading stock data...</p>
        </div>

        <div class="table-grid" id="tableGrid" style="display: none;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th data-sort="ticker">Stock <span class="sort-icon"></span></th>
                            <th data-sort="sector">Sector <span class="sort-icon"></span></th>
                            <th data-sort="current_price">Price <span class="sort-icon"></span></th>
                            <th data-sort="low_52week">52W Low <span class="sort-icon"></span></th>
                            <th data-sort="high_52week">52W High <span class="sort-icon"></span></th>
                            <th data-sort="pct_above_low">Above Low <span class="sort-icon"></span></th>
                            <th>Range</th>
                            <th data-sort="pe_ratio">P/E <span class="sort-icon"></span></th>
                            <th data-sort="forward_pe">NTM P/E <span class="sort-icon"></span></th>
                            <th data-sort="market_cap">Mkt Cap <span class="sort-icon"></span></th>
                        </tr>
                    </thead>
                    <tbody id="tableBodyA"></tbody>
                </table>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th data-sort="ticker">Stock <span class="sort-icon"></span></th>
                            <th data-sort="sector">Sector <span class="sort-icon"></span></th>
                            <th data-sort="current_price">Price <span class="sort-icon"></span></th>
                            <th data-sort="low_52week">52W Low <span class="sort-icon"></span></th>
                            <th data-sort="high_52week">52W High <span class="sort-icon"></span></th>
                            <th data-sort="pct_above_low">Above Low <span class="sort-icon"></span></th>
                            <th>Range</th>
                            <th data-sort="pe_ratio">P/E <span class="sort-icon"></span></th>
                            <th data-sort="forward_pe">NTM P/E <span class="sort-icon"></span></th>
                            <th data-sort="market_cap">Mkt Cap <span class="sort-icon"></span></th>
                        </tr>
                    </thead>
                    <tbody id="tableBodyB"></tbody>
                </table>
            </div>
        </div>

        <div class="no-data" id="noData" style="display: none;">
            <p>No stocks found within the threshold. Check back later!</p>
        </div>
    </div>

    <script>
        let stockData = [];
        let currentSort = { column: 'pct_above_low', direction: 'asc' };

        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                stockData = data.stocks;
                renderData(data);
                setupSorting();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').innerHTML = `
                    <p>Unable to load data. Run the screener script to generate data.</p>
                    <p style="margin-top: 1rem; font-size: 0.875rem;">python screener.py</p>
                `;
            }
        }

        function setupSorting() {
            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.addEventListener('click', () => {
                    const column = th.dataset.sort;
                    if (currentSort.column === column) {
                        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSort.column = column;
                        currentSort.direction = 'asc';
                    }
                    sortAndRender();
                    updateSortIndicators();
                });
            });
            updateSortIndicators();
        }

        function updateSortIndicators() {
            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.sort === currentSort.column) {
                    th.classList.add(currentSort.direction === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });
        }

        function sortAndRender() {
            const sorted = [...stockData].sort((a, b) => {
                let aVal = a[currentSort.column];
                let bVal = b[currentSort.column];

                if (aVal === null || aVal === undefined) aVal = currentSort.direction === 'asc' ? Infinity : -Infinity;
                if (bVal === null || bVal === undefined) bVal = currentSort.direction === 'asc' ? Infinity : -Infinity;

                if (typeof aVal === 'string') {
                    return currentSort.direction === 'asc'
                        ? aVal.localeCompare(bVal)
                        : bVal.localeCompare(aVal);
                }
                return currentSort.direction === 'asc' ? aVal - bVal : bVal - aVal;
            });
            renderTable(sorted);
        }

        function renderData(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('stocksFound').textContent = data.stocks_found;
            document.getElementById('totalScreened').textContent = data.total_screened;
            document.getElementById('threshold').textContent = `≤${data.threshold_percent}%`;
            const utcDate = new Date(data.last_updated + ' UTC');
            const osloTime = utcDate.toLocaleString('en-GB', { timeZone: 'Europe/Oslo', dateStyle: 'medium', timeStyle: 'short' });
            document.getElementById('lastUpdated').textContent = `Last updated: ${osloTime} (Oslo)`;

            if (data.stocks.length === 0) {
                document.getElementById('noData').style.display = 'block';
                return;
            }

            document.getElementById('tableGrid').style.display = 'grid';
            renderTable(data.stocks);
        }

        function rowHtml(stock) {
            const pctClass = stock.pct_above_low <= 5 ? 'pct-low' : 'pct-med';
            return `
                <td>
                    <div class="stock-cell">
                        <span class="ticker">${stock.ticker}</span>
                        <span class="company-name">${stock.name}</span>
                    </div>
                </td>
                <td><span class="sector-badge">${stock.sector}</span></td>
                <td class="price">$${stock.current_price.toFixed(2)}</td>
                <td class="price">$${stock.low_52week.toFixed(2)}</td>
                <td class="price">$${stock.high_52week.toFixed(2)}</td>
                <td><span class="pct-badge ${pctClass}">+${stock.pct_above_low.toFixed(1)}%</span></td>
                <td>
                    <div class="range-bar">
                        <div class="range-fill"></div>
                        <div class="range-marker" style="left: ${stock.range_position}%"></div>
                    </div>
                </td>
                <td class="price">${stock.pe_ratio_fmt}</td>
                <td class="price">${stock.forward_pe_fmt}</td>
                <td class="price">${stock.market_cap_fmt}</td>
            `;
        }

        function renderTable(stocks) {
            const tbodyA = document.getElementById('tableBodyA');
            const tbodyB = document.getElementById('tableBodyB');
            tbodyA.innerHTML = '';
            tbodyB.innerHTML = '';

            const twoColumn = window.matchMedia('(min-width: 1500px)').matches;
            const half = twoColumn ? Math.ceil(stocks.length / 2) : stocks.length;

            stocks.forEach((stock, i) => {
                const row = document.createElement('tr');
                row.innerHTML = rowHtml(stock);
                (i < half ? tbodyA : tbodyB).appendChild(row);
            });
        }

        window.addEventListener('resize', () => {
            if (stockData.length) sortAndRender();
        });

        loadData();
    </script>
</body>
</html>
